
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nishanthan Suseekaran | My Gallery</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #071426;
  color: white;
}

header {
  text-align: center;
  padding: 28px 15px;
  background: linear-gradient(135deg, #102d50, #641e40);
}

header h1 { margin-bottom: 10px; }

main {
  max-width: 1100px;
  margin: auto;
  padding: 20px;
}

.panel, .photo-card {
  background: #10243c;
  padding: 20px;
  border-radius: 14px;
  margin-bottom: 22px;
}

input, textarea, button {
  font: inherit;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #47617e;
}

input, textarea {
  width: 100%;
  margin: 8px 0;
  background: #f8fafc;
  color: #111827;
}

button, .back {
  background: #d94686;
  color: white;
  border: 0;
  cursor: pointer;
  padding: 12px 17px;
  border-radius: 8px;
  text-decoration: none;
  display: inline-block;
  margin: 5px 3px;
}

button:hover, .back:hover { background: #a92562; }

button:disabled {
  opacity: 0.6;
  cursor: wait;
}

#gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
  gap: 15px;
}

.photo-card {
  padding: 10px;
  margin-bottom: 0;
  overflow: hidden;
}

.photo-card img {
  width: 100%;
  height: 180px;
  object-fit: cover;
  border-radius: 8px;
  cursor: pointer;
}

.photo-card h3, .photo-card p {
  overflow-wrap: anywhere;
}

.photo-card h3 { font-size: 16px; }
.photo-card p { color: #d6e2f0; }

#status {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  color: #fcd34d;
}

#viewer {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.92);
  z-index: 10;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  padding: 20px;
}

#viewer img {
  max-width: 96%;
  max-height: 78vh;
  object-fit: contain;
  border-radius: 6px;
}

footer {
  text-align: center;
  padding: 25px;
  color: #cbd5e1;
}

</style>
</head>

<body>

<header>
  <h1>📸 Gallery</h1>
  <p>Nishanthan Suseekaran</p>
  <p>Welcome</p>
  <a class="back" href="index.html">← Back to Home</a>
</header>

<main>

  <section class="panel">
    <h2>➕ Upload Photos</h2>
    <p>Select photos to share them in the online gallery.</p>

    <label for="photos">Choose photos</label>
    <input id="photos" type="file" accept="image/*" multiple>

    <label for="photoTitle">Photo title</label>
    <input id="photoTitle" type="text"
           placeholder="Enter photo title" maxlength="150">

    <label for="photoDescription">Photo description</label>
    <textarea id="photoDescription"
              placeholder="Write your memories here"
              maxlength="1000"></textarea>

    <button id="uploadButton" type="button">
      📤 Add Selected Photos
    </button>

    <button id="refreshButton" type="button">
      🔄 Refresh Gallery
    </button>

    <p id="status" role="status">
      Connecting to online gallery...
    </p>
  </section>

  <section>
    <h2>🖼️ Photos</h2>
    <p id="count">Loading photos...</p>
    <div id="gallery"></div>
  </section>

</main>

<div id="viewer" role="dialog" aria-modal="true"
     aria-label="Photo viewer">
  <button id="closeViewer" type="button">✕ Close</button>
  <img id="largePhoto" alt="Selected gallery photo">
  <p id="largeTitle"></p>
</div>

<footer>
  © 2026 Nishanthan Suseekaran
  <p>nishanthan2001@gmail.com</p>
</footer>

<!-- Supabase JavaScript library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/*
  IMPORTANT:
  Replace the two values below with your own Supabase
  Project URL and publishable/anon key.

  Never put a service_role or secret key in this HTML.
*/

const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL";
const SUPABASE_KEY = "YOUR_SUPABASE_PUBLISHABLE_OR_ANON_KEY";
const BUCKET = "gallery-photos";

const gallery = document.getElementById("gallery");
const photoInput = document.getElementById("photos");
const titleInput = document.getElementById("photoTitle");
const descriptionInput = document.getElementById("photoDescription");
const statusText = document.getElementById("status");
const countText = document.getElementById("count");
const uploadButton = document.getElementById("uploadButton");
const refreshButton = document.getElementById("refreshButton");

let supabaseClient = null;

function setStatus(message) {
  statusText.textContent = message;
}

function initializeSupabase() {
  if (
    SUPABASE_URL.startsWith("YOUR_") ||
    SUPABASE_KEY.startsWith("YOUR_")
  ) {
    setStatus(
      "Setup needed: add your Supabase Project URL and publishable key."
    );
    return false;
  }

  if (!window.supabase) {
    setStatus("Supabase library did not load. Check your internet.");
    return false;
  }

  supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  return true;
}

function showViewer(url, title) {
  document.getElementById("largePhoto").src = url;
  document.getElementById("largeTitle").textContent = title;
  document.getElementById("viewer").style.display = "flex";
}

function closeViewer() {
  document.getElementById("viewer").style.display = "none";
  document.getElementById("largePhoto").src = "";
}

function renderGallery(rows) {
  gallery.replaceChildren();

  countText.textContent =
    rows.length + (rows.length === 1 ? " photo" : " photos");

  rows.forEach((photo) => {
    const card = document.createElement("article");
    card.className = "photo-card";

    const imageResult = supabaseClient
      .storage
      .from(BUCKET)
      .getPublicUrl(photo.file_path);

    const img = document.createElement("img");
    img.src = imageResult.data.publicUrl;
    img.alt = photo.title || "Gallery photo";
    img.loading = "lazy";

    img.addEventListener("click", () => {
      showViewer(img.src, photo.title || "My Photo");
    });

    const heading = document.createElement("h3");
    heading.textContent = photo.title || "My Photo";

    const description = document.createElement("p");
    description.textContent = photo.description || "";

    card.append(img, heading, description);
    gallery.append(card);
  });
}

async function loadPhotos() {
  if (!supabaseClient) return;

  setStatus("Loading shared online photos...");
  refreshButton.disabled = true;

  try {
    const { data, error } = await supabaseClient
      .from("gallery_photos")
      .select("id, title, description, file_path, created_at")
      .order("created_at", { ascending: false })
      .limit(500);

    if (error) throw error;

    renderGallery(data || []);
    setStatus("Online gallery loaded successfully.");
  } catch (error) {
    setStatus(
      "Could not load photos: " + error.message +
      "\nCheck your table, bucket and Supabase policies."
    );
    countText.textContent = "Unable to load photos";
  } finally {
    refreshButton.disabled = false;
  }
}

async function uploadPhotos() {
  if (!supabaseClient) {
    setStatus("Please complete Supabase setup first.");
    return;
  }

  const files = Array.from(photoInput.files || [])
    .filter(file => file.type.startsWith("image/"));

  if (!files.length) {
    setStatus("Please select at least one photo.");
    return;
  }

  // Limit each upload to 5 MB.
  const tooLarge = files.find(file => file.size > 5 * 1024 * 1024);

  if (tooLarge) {
    setStatus("Each photo must be 5 MB or smaller.");
    return;
  }

  uploadButton.disabled = true;
  refreshButton.disabled = true;

  let uploaded = 0;
  const failures = [];

  try {
    for (const file of files) {
      setStatus("Uploading: " + file.name);

      const uniqueName =
        Date.now() + "-" +
        Math.random().toString(36).slice(2) + "-" +
        file.name.replace(/[^a-zA-Z0-9._-]/g, "_");

      const { data: fileData, error: uploadError } =
        await supabaseClient
          .storage
          .from(BUCKET)
          .upload(uniqueName, file, {
            contentType: file.type,
            upsert: false
          });

      if (uploadError) {
        failures.push(file.name + ": " + uploadError.message);
        continue;
      }

      const { error: databaseError } = await supabaseClient
        .from("gallery_photos")
        .insert({
          title: titleInput.value.trim() || file.name,
          description: descriptionInput.value.trim(),
          file_path: fileData.path
        });

      if (databaseError) {
        failures.push(file.name + ": " + databaseError.message);
        continue;
      }

      uploaded++;
    }

    photoInput.value = "";
    titleInput.value = "";
    descriptionInput.value = "";

    await loadPhotos();

    if (failures.length) {
      setStatus(
        uploaded + " photo(s) uploaded.\nSome uploads failed:\n" +
        failures.join("\n")
      );
    } else {
      setStatus(
        uploaded + " photo(s) uploaded to the shared online gallery."
      );
    }

  } catch (error) {
    setStatus("Upload error: " + error.message);
  } finally {
    uploadButton.disabled = false;
    refreshButton.disabled = false;
  }
}

uploadButton.addEventListener("click", uploadPhotos);
refreshButton.addEventListener("click", loadPhotos);

document.getElementById("closeViewer")
  .addEventListener("click", closeViewer);

document.getElementById("viewer")
  .addEventListener("click", (event) => {
    if (event.target.id === "viewer") closeViewer();
  });

if (initializeSupabase()) {
  loadPhotos();
}
</script>

</body>
</html>
